<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Rizal & Selvi</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: #0b1a30;
            overflow-x: hidden;
        }

        /* Hero / Cover Section */
        .hero-cover {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 40px 20px 60px 20px;
            /* Ganti 'foto-prewedding.jpg' dengan nama file foto latar belakang Anda */
            background: linear-gradient(180deg, rgba(11, 26, 48, 0.4) 0%, rgba(11, 26, 48, 0.85) 100%), 
                        url('foto-prewedding.jpg') center/cover no-repeat;
        }

        .header-title {
            margin-top: 20px;
        }

        .sub-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            font-size: 13px;
            color: #d4af37; /* Warna emas */
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* CONTAINER GAMBAR TULISAN NAMA */
        .name-wrapper {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* 
           Gunakan kombinasi -webkit-filter & filter agar gambar tulisan nama 
           terbaca PUTIH BERSIH di SEMUA BROWSER HP (Android/iOS)
        */
        .name-image-cover {
            width: 280px;
            max-width: 85%;
            height: auto;
            display: block;
            margin: 0 auto;
            
            /* Trik agar PNG Gelap/Transparan diubah jadi PUTIH di browser apa saja */
            -webkit-filter: brightness(0) invert(1) drop-shadow(0px 2px 10px rgba(0, 0, 0, 0.8)) !important;
            filter: brightness(0) invert(1) drop-shadow(0px 2px 10px rgba(0, 0, 0, 0.8)) !important;
            
            /* Mencegah bug kompresi/render di GPU HP */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .wedding-date {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #e0e0e0;
            margin-top: 10px;
            font-weight: 300;
        }

        /* Action Buttons */
        .bottom-action {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-open {
            background: transparent;
            border: 1px solid #d4af37;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            background-color: rgba(11, 26, 48, 0.4);
        }

        .btn-open:hover, .btn-open:active {
            background-color: #d4af37;
            color: #0b1a30;
        }

        .music-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid #d4af37;
            background: rgba(11, 26, 48, 0.6);
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Audio Player Hidden */
        #wedding-audio {
            display: none;
        }
    </style>
</head>
<body>

    <section class="hero-cover">
        <!-- Judul Atas -->
        <div class="header-title">
            <p class="sub-title">THE WEDDING OF</p>
            
            <!-- Gambar Tulisan Nama -->
            <div class="name-wrapper">
                <img src="nama-teks.png" alt="Rizal & Selvi" class="name-image-cover">
            </div>

            <p class="wedding-date">JUM'AT, 11 SEPTEMBER 2026</p>
        </div>

        <!-- Tombol Aksi Bawah -->
        <div class="bottom-action">
            <button class="btn-open" onclick="bukaUndangan()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                Buka Undangan
            </button>
            <div class="music-btn" onclick="toggleMusic()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
        </div>
    </section>

    <!-- Musik Latar (Pastikan file musik ada jika ingin diputar) -->
    <audio id="wedding-audio" loop>
        <source src="backsound.mp3" type="audio/mpeg">
    </audio>

    <script>
        function bukaUndangan() {
            // Putar musik saat tombol dibuka
            var audio = document.getElementById("wedding-audio");
            if (audio) {
                audio.play().catch(function(error) {
                    console.log("Audio autoplay dicegah browser:", error);
                });
            }

            // Arahkan ke bagian isi undangan atau buka halaman berikutnya
            alert("Membuka undangan...");
            // Contoh jika ada elemen utama yang tersembunyi:
            // document.querySelector('.main-content').scrollIntoView({ behavior: 'smooth' });
        }

        function toggleMusic() {
            var audio = document.getElementById("wedding-audio");
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
    </script>
</body>
</html>
