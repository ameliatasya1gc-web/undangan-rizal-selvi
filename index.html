<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Prewedding - Rizal & Selvi</title>
    <!-- Import Font Sacramento & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1a30;
            --card-bg: #132743;
            --accent-gold: #d4af37;
            --text-light: #f0f4f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* COVER LAYAR UTAMA */
        .cover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(11, 26, 48, 0.4), rgba(11, 26, 48, 0.85)), url('foto-prewedding.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px;
            z-index: 999;
            transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
            text-align: center;
        }

        .cover-screen.open {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .cover-title {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        /* FONT NAMA SESUAI GAMBAR */
        .cover-names {
            font-family: 'Sacramento', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin: 5px 0;
            font-weight: normal;
        }

        .cover-date {
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-open {
            border: 2px solid var(--accent-gold);
            background: rgba(19, 39, 67, 0.8);
            color: #fff;
            padding: 12px 30px;
            font-size: 1rem;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: 0.3s;
        }

        /* HALAMAN KEDUA (FOKUS TEKS) */
        .main-content {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .container {
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .event-info {
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding: 25px 0;
            margin: 30px 0;
        }

        .event-info h3 {
            color: var(--accent-gold);
            font-size: 1.1rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .event-info p {
            font-size: 0.9rem;
            line-height: 1.8;
            margin-bottom: 8px;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .time-box {
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 10px 8px;
            min-width: 65px;
            background: rgba(11, 26, 48, 0.6);
        }

        .time-box span {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-gold);
        }

        .time-box label {
            font-size: 0.65rem;
            letter-spacing: 1px;
        }

        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 99;
        }
    </style>
</head>
<body>

    <!-- Audio Player -->
    <audio id="bgMusic" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <!-- Halaman 1: Sampul Utama (Font Nama Sesuai Gambar Contoh) -->
    <div class="cover-screen" id="coverScreen">
        <div>
            <p class="cover-title">The Wedding Of</p>
            <h1 class="cover-names">Rizal & Selvi</h1>
            <p class="cover-date">Jumat, 11 September 2026</p>
        </div>
        <button class="btn-open" onclick="openInvitation()">✉ Buka Undangan</button>
    </div>

    <!-- Tombol Musik -->
    <div class="music-control" onclick="toggleMusic()">🎵</div>

    <!-- Halaman 2: Hanya Teks Keterangan Acara -->
    <div class="main-content">
        <div class="container" data-aos="fade-up" data-aos-duration="1000">
            <p style="color: var(--accent-gold); letter-spacing: 2px; font-size: 0.85rem; margin-bottom: 5px;">WEDDING INVITATION</p>
            <h2 style="font-family: 'Sacramento', cursive; font-size: 3.5rem; margin-bottom: 5px; font-weight: normal;">Rizal & Selvi</h2>
            <p style="font-size: 0.85rem; letter-spacing: 1px; opacity: 0.9;">Mempelai Pria & Mempelai Wanita</p>

            <!-- Detail Acara -->
            <div class="event-info" data-aos="fade-up">
                <h3>AKAD NIKAH & RESEPSI</h3>
                <p><strong>Hari / Tanggal:</strong><br>Jumat, 11 September 2026</p>
                <p><strong>Waktu:</strong><br>08.00 WIB - Selesai</p>
                <p><strong>Lokasi:</strong><br>Kediaman Mempelai Wanita</p>
            </div>

            <p style="font-size: 0.8rem; letter-spacing: 2px; color: var(--accent-gold); margin-bottom: 15px;">MENUJU HARI BAHAGIA</p>
            <div class="countdown" data-aos="fade-up">
                <div class="time-box"><span id="days">00</span><label>HARI</label></div>
                <div class="time-box"><span id="hours">00</span><label>JAM</label></div>
                <div class="time-box"><span id="minutes">00</span><label>MENIT</label></div>
                <div class="time-box"><span id="seconds">00</span><label>DETIK</label></div>
            </div>
        </div>
    </div>

    <!-- Script Kontrol -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        const music = document.getElementById('bgMusic');
        let isPlaying = false;

        function openInvitation() {
            document.getElementById('coverScreen').classList.add('open');
            music.play();
            isPlaying = true;
        }

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
            } else {
                music.play();
            }
            isPlaying = !isPlaying;
        }

        // Timer Hitung Mundur
        const targetDate = new Date("September 11, 2026 08:00:00").getTime();
        setInterval(function() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);
    </script>
</body>
</html>
